<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fotografía Profesional Santiago Chile - Francisco Santelices ⭐ Especialista en Fotografía Artística, Retratos Corporativos, Fotografía Comercial y Composiciones Visuales. Portfolio 2025 con exploración fotográfica contemporánea y servicios profesionales en Chile.">
    <meta name="keywords" content="fotografía profesional santiago chile, fotógrafo profesional chile, retratos corporativos santiago, fotografía comercial chile, fotografía artística, sesiones fotográficas chile, Francisco Santelices fotografía, portfolio fotográfico chile">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.franciscosantelices.cl/photography.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.franciscosantelices.cl/photography.html">
    <meta property="og:title" content="Fotografía - Francisco Santelices Ariztía">
    <meta property="og:description" content="Portfolio de fotografía artística y retratos por Francisco Santelices Ariztía.">
    <meta property="og:image" content="https://www.franciscosantelices.cl/assets/photography/A.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Fotografía - Francisco Santelices Ariztía">
    <meta property="twitter:description" content="Portfolio de fotografía artística y retratos.">
    <meta property="twitter:image" content="https://www.franciscosantelices.cl/assets/photography/A.jpg">
    
    <title>Fotografía Profesional Santiago Chile - Retratos & Fotografía Comercial | Francisco Santelices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"></noscript>
    <link rel="preload" href="styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="styles.css"></noscript>
    <style>
        /* Photography page specific styles */
        .photography-page {
            background-color: #050505;
            color: #FFFFFF;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        /* Content spacing for header */
        .photography-content {
            padding-top: 120px;
            min-height: 100vh;
        }

        /* Random display section */
        .random-display-section {
            height: calc(100vh - 120px);
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .random-photo-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .random-photo {
            width: 100vw;
            height: auto;
            max-height: 100%;
            object-fit: cover;
            object-position: center;
            transition: opacity 0.5s ease-in-out;
        }


        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: #CCCCCC;
            font-size: 0.9rem;
            text-align: center;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        /* Gallery section */
        .gallery-section {
            padding: 4rem 0;
            background: #050505;
        }

        .gallery-container {
            width: 100%;
            padding: 0 2rem;
        }

        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .gallery-item {
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }


        /* Navigation menu - inherited from styles.css */
        
        /* Responsive */
        @media (max-width: 768px) {
            .photography-content {
                padding-top: 110px;
            }
            
            .gallery-container {
                padding: 0 1rem;
            }
            
            .gallery-grid {
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .photography-content {
                padding-top: 100px;
            }
            
            .scroll-indicator {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body class="photography-page">
    <div id="custom-cursor"></div>

    <!-- Header igual al del portfolio -->
    <header class="main-header">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Francisco Santelices Logo" class="logo-image" loading="eager" decoding="async">
            <div class="logo-text">
                <span class="logo-main">FRANCISCO SANTELICES ARIZTÍA</span>
                <span class="logo-sub">CREATIVE CONTENT</span>
            </div>
        </div>
        <div id="menu-trigger">
            <span class="menu-trigger-text">CLICK TO MENU</span>
            <span class="menu-trigger-cursor"></span>
        </div>
    </header>

    <!-- Navegación igual al del portfolio -->
    <nav class="main-navigation">
        <button class="nav-btn" data-section="lets-create">Cotiza tu Proyecto</button>
        <button class="nav-btn" data-section="audiovisual">Audiovisual</button>
        <button class="nav-btn" data-section="photography">Fotografía</button>
        <button class="nav-btn" data-section="design">Diseño</button>
        <button class="nav-btn" data-section="bio">Bio</button>
    </nav>

    <div class="photography-content">
        <!-- Random display section -->
        <section class="random-display-section">
            <div class="random-photo-container">
                <img id="random-photo" class="random-photo" src="" alt="Fotografía por Francisco Santelices">
                <div class="scroll-indicator">
                    <div style="font-size: 1.2rem;">↓</div>
                </div>
            </div>
        </section>

        <!-- Gallery section -->
        <section class="gallery-section">
            <div class="gallery-container">
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Photos will be loaded here by JavaScript -->
                </div>
            </div>
        </section>
    </div>

    <script>
        // Photography data - exact files in assets/photography/
        const photos = [
            'A.jpg', 'B.jpg', 'C.jpg', 'D.jpg', 'E.jpg', 'F.jpg', 'G.jpg', 'H.jpg', 
            'I.jpg', 'J.jpg', 'K.jpg', 'L.jpg', 'M.jpg', 'N.jpg', 'Ñ.jpg', 'O.jpg', 
            'P.jpg', 'Q.jpg', 'R.jpg', 'S.jpg', 'T.jpg', 'U.jpg', 'V.jpg', 'W.jpg', 'X.jpg'
        ];
        
        let currentRandomIndex = 0;
        let photoInterval;

        // Load random photo
        function loadRandomPhoto() {
            const randomIndex = Math.floor(Math.random() * photos.length);
            const randomPhoto = document.getElementById('random-photo');
            
            randomPhoto.style.opacity = '0';
            
            setTimeout(() => {
                randomPhoto.src = `assets/photography/${photos[randomIndex]}`;
                randomPhoto.alt = `Fotografía ${photos[randomIndex].replace('.jpg', '').replace('.JPG', '')} - Francisco Santelices`;
                currentRandomIndex = randomIndex;
                randomPhoto.style.opacity = '1';
            }, 250);
        }

        // Start automatic photo slideshow
        function startPhotoSlideshow() {
            // Load first photo immediately
            loadRandomPhoto();
            
            // Then change every 8 seconds
            photoInterval = setInterval(() => {
                loadRandomPhoto();
            }, 8000);
        }

        // Stop slideshow (if needed for cleanup)
        function stopPhotoSlideshow() {
            if (photoInterval) {
                clearInterval(photoInterval);
            }
        }

        // Generate gallery
        function loadGallery() {
            const galleryGrid = document.getElementById('gallery-grid');
            
            if (!galleryGrid) {
                console.error('Gallery grid element not found!');
                return;
            }
            
            console.log('Loading', photos.length, 'photos into gallery...');
            
            photos.forEach((photo, index) => {
                console.log(`Creating gallery item ${index + 1}: ${photo}`);
                
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                
                const img = document.createElement('img');
                img.src = `assets/photography/${photo}`;
                img.alt = `Fotografía ${photo.replace('.jpg', '').replace('.JPG', '')} - Francisco Santelices`;
                img.loading = 'lazy';
                
                // Add error handling for images
                img.onerror = function() {
                    console.error('Failed to load image:', this.src);
                };
                
                img.onload = function() {
                    console.log('Successfully loaded:', this.src);
                };
                
                galleryItem.appendChild(img);
                galleryGrid.appendChild(galleryItem);
            });
            
            console.log('Gallery loading complete. Items added:', galleryGrid.children.length);
        }

        // Custom cursor functionality (from other pages)
        const cursor = document.getElementById('custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.transform = 'translate(-50%, -50%)';
        });

        // Hover effects
        const hoverElements = document.querySelectorAll('.gallery-item, a, button, .nav-btn, #menu-trigger');
        
        hoverElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                document.body.classList.add('cursor-hover');
            });
            
            element.addEventListener('mouseleave', () => {
                document.body.classList.remove('cursor-hover');
            });
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Photography page loaded with', photos.length, 'photos');
            
            // Start automatic slideshow
            startPhotoSlideshow();
            
            // Load gallery
            loadGallery();
            
            // Initialize cursor
            cursor.style.opacity = '1';
            
            // Debug: Check if gallery items were created
            setTimeout(() => {
                const galleryItems = document.querySelectorAll('.gallery-item');
                console.log('Gallery items created:', galleryItems.length);
            }, 1000);
        });

        // Navigation functionality (same as portfolio)
        document.getElementById('menu-trigger').addEventListener('click', () => {
            document.querySelector('.main-navigation').classList.toggle('active');
            document.body.classList.toggle('menu-open');
        });

        // Navigation buttons
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const section = e.target.getAttribute('data-section');
                
                switch(section) {
                    case 'audiovisual':
                        window.location.href = 'portfolio.html';
                        break;
                    case 'photography':
                        // Already on photography page
                        document.querySelector('.main-navigation').classList.remove('active');
                        document.body.classList.remove('menu-open');
                        break;
                    case 'design':
                        window.location.href = 'design.html';
                        break;
                    case 'bio':
                        window.location.href = 'bio.html';
                        break;
                    case 'lets-create':
                        // Do nothing - only works on main portfolio
                        document.querySelector('.main-navigation').classList.remove('active');
                        document.body.classList.remove('menu-open');
                        break;
                }
            });
        });

        // Smooth scroll for gallery
        document.querySelector('.scroll-indicator').addEventListener('click', () => {
            document.querySelector('.gallery-section').scrollIntoView({
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
