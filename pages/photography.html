<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Francisco Santelices Ariztía</title>
    <meta name="description" content="Galería de fotografía de Francisco Santelices Ariztía - Fotografía análoga y digital, series artísticas y trabajos comerciales.">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/lets-create.css">
    <style>
        /* Main header identical to main.html */
        .main-header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-image {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-main {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }

        .logo-sub {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 0.1rem;
        }

        .back-button {
            background: transparent;
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 0.5rem 1.5rem;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: var(--accent-yellow);
            color: var(--black);
        }

        /* Photography Gallery Layout */
        .photography-container {
            margin-top: 80px;
            background: var(--black);
            min-height: 100vh;
        }

        /* Main Slider - Full Width */
        .main-slider-container {
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden;
            background: #000;
        }

        .main-slider {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slider-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            cursor: pointer;
        }

        .slider-image.active {
            opacity: 1;
        }

        .slider-controls {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 100;
        }

        .slider-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .slider-btn:hover {
            background: var(--accent-yellow);
            color: var(--black);
        }

        /* Instagram-Style Feed Layout */
        .photo-feed-container {
            padding: 0;
            margin: 0;
            width: 100%;
        }

        .instagram-feed {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
            max-width: 100vw;
        }

        .feed-row {
            display: flex;
            gap: 2px;
            width: 100%;
            min-height: 300px;
        }

        .feed-row.large {
            min-height: 500px;
        }

        .feed-row.medium {
            min-height: 400px;
        }

        .feed-row.small {
            min-height: 250px;
        }

        /* Feed item variations */
        .feed-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #1a1a1a;
            flex: 1;
        }

        .feed-item.full-width {
            width: 100%;
        }

        .feed-item.half-width {
            width: 50%;
        }

        .feed-item.third-width {
            width: 33.333%;
        }

        .feed-item.two-thirds {
            width: 66.666%;
        }

        .feed-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
        }

        .feed-item:hover {
            transform: scale(1.02);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .feed-item:hover img {
            transform: scale(1.05);
        }

        /* Subtle overlay for click feedback - no text */
        .feed-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feed-item:hover .feed-overlay {
            opacity: 1;
        }

        /* Click indicator */
        .click-indicator {
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-yellow);
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--accent-yellow);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s ease;
        }

        .feed-item:hover .click-indicator {
            opacity: 1;
            transform: scale(1);
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            background: #1a1a1a;
        }

        /* Different sizes for modern layout */
        .grid-item:nth-child(1) {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .grid-item:nth-child(2) {
            grid-column: 3;
            grid-row: 1;
        }

        .grid-item:nth-child(3) {
            grid-column: 4;
            grid-row: 1;
        }

        .grid-item:nth-child(4) {
            grid-column: 3;
            grid-row: 2;
        }

        .grid-item:nth-child(5) {
            grid-column: 4;
            grid-row: 2;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
        }

        .grid-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* Lightbox with info strip */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            flex-direction: column;
        }

        .lightbox-image {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .lightbox-info {
            background: linear-gradient(135deg, #0D1117 0%, #1a1a1a 100%);
            padding: 2rem;
            border-top: 2px solid var(--accent-yellow);
        }

        .lightbox-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-yellow);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }

        .lightbox-description {
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.6;
        }

        .lightbox-close {
            position: absolute;
            top: -3rem;
            right: 0;
            background: var(--accent-yellow);
            color: var(--black);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lightbox-close:hover {
            transform: scale(1.1);
        }


        @media (max-width: 768px) {
            .main-slider-container {
                height: 40vh;
            }

            .feed-row {
                min-height: 200px;
            }

            .feed-row.large {
                min-height: 350px;
            }

            .feed-row.medium {
                min-height: 280px;
            }

            .feed-row.small {
                min-height: 180px;
            }

            .feed-overlay {
                padding: 1rem;
            }

            .feed-title {
                font-size: 1rem;
            }

            .feed-description {
                font-size: 0.8rem;
            }

            .header-content {
                padding: 0 1rem;
            }

            .logo-main {
                font-size: 0.8rem;
            }

            .logo-sub {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .main-slider-container {
                height: 35vh;
            }

            .feed-row {
                min-height: 180px;
            }

            .feed-row.large {
                min-height: 300px;
            }

            .feed-row.medium {
                min-height: 220px;
            }

            .feed-row.small {
                min-height: 160px;
            }

            .feed-overlay {
                padding: 0.8rem;
            }

            .feed-title {
                font-size: 0.9rem;
            }

            .feed-description {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="custom-cursor"></div>
    
    <!-- Header identical to main -->
    <header class="main-header">
        <div class="header-content">
            <div class="logo-container">
                <img src="../assets/logo.png" alt="Francisco Santelices Logo" class="logo-image">
                <div class="logo-text">
                    <span class="logo-main">FRANCISCO SANTELICES ARIZTÍA</span>
                    <span class="logo-sub">CREATIVE CONTENT STUDIO</span>
                </div>
            </div>
            <a href="../main.html" class="back-button">← Volver al Sitio</a>
        </div>
    </header>
    
    <div class="photography-container">
        <!-- Main Full-Width Slider -->
        <div class="main-slider-container">
            <div class="main-slider" id="main-slider">
                <!-- Images will be loaded here -->
            </div>
            <div class="slider-controls">
                <button class="slider-btn" id="prev-slide">‹</button>
                <button class="slider-btn" id="next-slide">›</button>
            </div>
        </div>

        <!-- Instagram-Style Photo Feed -->
        <div class="photo-feed-container">
            <div class="instagram-feed" id="photo-feed">
                <!-- Feed rows will be generated here dynamically -->
            </div>
        </div>
    </div>

    <!-- Advanced Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close" onclick="closeLightbox()">×</span>
            <img class="lightbox-image" id="lightbox-image" src="" alt="">
            <div class="lightbox-info">
                <div class="lightbox-title" id="lightbox-title">Título de la Fotografía</div>
                <div class="lightbox-description" id="lightbox-description">Descripción detallada de la fotografía...</div>
            </div>
        </div>
    </div>

    <script>
        // Unified Photography Gallery System
        class UnifiedPhotographyGallery {
            constructor() {
                this.currentSlide = 0;
                this.sliderImages = [];
                
                // Combine all images into one unified collection
                this.allImages = [
                    // Fotografía images
                    { filename: '1.jpg', title: 'Composición I', description: 'Exploración de luz y sombra en geometría urbana', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '2.jpg', title: 'Retrato Urbano', description: 'Captura espontánea de la vida citadina', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '3.jpg', title: 'Arquitectura Emocional', description: 'La relación entre espacio y sentimiento', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '4.jpg', title: 'Naturaleza Abstracta', description: 'Formas orgánicas en interpretación conceptual', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '5.jpg', title: 'Luz Cinematográfica', description: 'Juego dramático entre luz y oscuridad', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '6.jpg', title: 'Textura Urbana', description: 'Detalles que cuentan historias silenciosas', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '7.jpg', title: 'Movimiento Congelado', description: 'Captura del tiempo en suspensión', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '8.jpg', title: 'Perspectiva Única', description: 'Ángulos que transforman la realidad', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '9.jpg', title: 'Contraste Social', description: 'Documentación de la diversidad humana', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '10.jpg', title: 'Geometría Natural', description: 'Patrones ocultos en la naturaleza', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '11.jpg', title: 'Atmósfera Nocturna', description: 'La ciudad bajo el manto de la noche', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '12.jpg', title: 'Reflexiones', description: 'Realidad multiplicada en superficies', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '13.jpg', title: 'Minimalismo Urbano', description: 'La belleza de la simplicidad', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '14.jpg', title: 'Narrativa Visual', description: 'Historias contadas sin palabras', path: '../assets/images/Photo/Fotografía/' },
                    { filename: '15.jpg', title: 'Color y Emoción', description: 'Paletas que evocan sentimientos', path: '../assets/images/Photo/Fotografía/' },
                    { filename: 'KEROSENE RESIZE.jpg', title: 'Kerosene', description: 'Serie experimental con elementos industriales', path: '../assets/images/Photo/Fotografía/' },
                    { filename: 'TELE.jpg', title: 'Telepático', description: 'Conexión visual entre mundos paralelos', path: '../assets/images/Photo/Fotografía/' },
                    // Recuerdos Deconstruidos images
                    { filename: 'Recuerdos deconstruidos 1.png', title: 'Fragmento I', description: 'Primer acercamiento a la deconstrucción de la memoria', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 2.JPG', title: 'Fragmento II', description: 'Capas temporales superpuestas en una imagen', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 3.JPG', title: 'Fragmento III', description: 'La nostalgia como elemento compositivo', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 4.JPG', title: 'Fragmento IV', description: 'Reconstrucción visual de momentos perdidos', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 5.JPG', title: 'Fragmento V', description: 'Texturas del tiempo en la memoria colectiva', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 6.jpg', title: 'Fragmento VI', description: 'Diálogo entre pasado y presente visual', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 7.jpg', title: 'Fragmento VII', description: 'Arqueología fotográfica de emociones', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 8.jpg', title: 'Fragmento VIII', description: 'La identidad fragmentada en múltiples planos', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 9.jpg', title: 'Fragmento IX', description: 'Síntesis visual de experiencias difusas', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 10.jpg', title: 'Fragmento X', description: 'Culminación conceptual de la serie deconstructiva', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 11.JPG', title: 'Fragmento XI', description: 'Epílogo visual: la memoria como construcción permanente', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' }
                ];

                this.init();
            }

            init() {
                this.loadSlider();
                this.loadInstagramFeed();
                this.setupEventListeners();
            }

            setupEventListeners() {
                // Slider controls
                document.getElementById('prev-slide').addEventListener('click', () => this.prevSlide());
                document.getElementById('next-slide').addEventListener('click', () => this.nextSlide());

                // Auto-advance slider
                setInterval(() => this.nextSlide(), 5000);
            }

            loadSlider() {
                const slider = document.getElementById('main-slider');
                
                // Use first 8 images for slider
                this.sliderImages = this.allImages.slice(0, 8);
                this.currentSlide = 0;
                
                slider.innerHTML = '';
                
                this.sliderImages.forEach((image, index) => {
                    const img = document.createElement('img');
                    img.src = image.path + image.filename;
                    img.alt = image.title;
                    img.className = 'slider-image' + (index === 0 ? ' active' : '');
                    img.loading = 'lazy';
                    // Fix: Click should open the CURRENT active slider image
                    img.onclick = () => this.openCurrentSliderImage();
                    slider.appendChild(img);
                });
            }

            loadInstagramFeed() {
                const feed = document.getElementById('photo-feed');
                
                // Get all remaining images after slider (8 first images used in slider)
                const remainingFotografia = this.allImages.slice(8, 17); // Remaining fotografía images
                const recuerdosImages = this.allImages.slice(17); // All recuerdos deconstruidos
                
                feed.innerHTML = '';
                
                // Create specific layout for Recuerdos Deconstruidos as requested
                const specificRecuerdos = [
                    { filename: 'Recuerdos deconstruidos 1.png', title: 'Fragmento I', description: 'Primer acercamiento a la deconstrucción de la memoria', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 6.jpg', title: 'Fragmento VI', description: 'Diálogo entre pasado y presente visual', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 8.jpg', title: 'Fragmento VIII', description: 'La identidad fragmentada en múltiples planos', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 10.jpg', title: 'Fragmento X', description: 'Culminación conceptual de la serie deconstructiva', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 7.jpg', title: 'Fragmento VII', description: 'Arqueología fotográfica de emociones', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 11.JPG', title: 'Fragmento XI', description: 'Epílogo visual: la memoria como construcción permanente', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 2.JPG', title: 'Fragmento II', description: 'Capas temporales superpuestas en una imagen', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 3.JPG', title: 'Fragmento III', description: 'La nostalgia como elemento compositivo', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 4.JPG', title: 'Fragmento IV', description: 'Reconstrucción visual de momentos perdidos', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 5.JPG', title: 'Fragmento V', description: 'Texturas del tiempo en la memoria colectiva', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' },
                    { filename: 'Recuerdos deconstruidos 9.jpg', title: 'Fragmento IX', description: 'Síntesis visual de experiencias difusas', path: '../assets/images/Photo/RECUERDOS DECONSTRUIDOS/' }
                ];
                
                // First mix some fotografía with the beginning of recuerdos
                let mixedImages = [...remainingFotografia.slice(0, 3), ...specificRecuerdos.slice(0, 1)]; // 3 foto + RD1
                this.createVariedRows(feed, mixedImages.slice(0, 4));
                
                // Special layout as requested:
                // Row with RD6 (left) and RD8 (right small)
                this.createSpecialRow1(feed, specificRecuerdos[1], specificRecuerdos[2]); // RD6, RD8
                
                // Row with RD10 (small left), RD7 (remaining space)
                this.createSpecialRow2(feed, specificRecuerdos[3], specificRecuerdos[4]); // RD10, RD7
                
                // RD11 full width
                this.createFullWidthRow(feed, specificRecuerdos[5]); // RD11
                
                // Continue with remaining fotografía mixed with remaining recuerdos
                const remainingAll = [...remainingFotografia.slice(3), ...specificRecuerdos.slice(6)];
                this.createVariedRows(feed, remainingAll);
            }

            createSpecialRow1(feed, leftImage, rightImage) {
                const feedRow = document.createElement('div');
                feedRow.className = 'feed-row medium';
                
                // Left image (RD6) - two thirds
                const leftItem = this.createFeedItem(leftImage, 'two-thirds');
                
                // Right image (RD8) - small, one third
                const rightItem = this.createFeedItem(rightImage, 'third-width');
                
                feedRow.appendChild(leftItem);
                feedRow.appendChild(rightItem);
                feed.appendChild(feedRow);
            }

            createSpecialRow2(feed, leftImage, rightImage) {
                const feedRow = document.createElement('div');
                feedRow.className = 'feed-row medium';
                
                // Left small (RD10) - one third
                const leftItem = this.createFeedItem(leftImage, 'third-width');
                
                // Right (RD7) - two thirds  
                const rightItem = this.createFeedItem(rightImage, 'two-thirds');
                
                feedRow.appendChild(leftItem);
                feedRow.appendChild(rightItem);
                feed.appendChild(feedRow);
            }

            createFullWidthRow(feed, image) {
                const feedRow = document.createElement('div');
                feedRow.className = 'feed-row large';
                
                const feedItem = this.createFeedItem(image, 'full-width');
                feedRow.appendChild(feedItem);
                feed.appendChild(feedRow);
            }

            createVariedRows(feed, images) {
                const layouts = [
                    { rowClass: 'large', items: ['half-width', 'half-width'] },
                    { rowClass: 'medium', items: ['third-width', 'third-width', 'third-width'] },
                    { rowClass: 'large', items: ['full-width'] },
                    { rowClass: 'medium', items: ['two-thirds', 'third-width'] },
                    { rowClass: 'small', items: ['half-width', 'half-width'] }
                ];
                
                let imageIndex = 0;
                let layoutIndex = 0;
                
                while (imageIndex < images.length) {
                    const layout = layouts[layoutIndex % layouts.length];
                    const feedRow = document.createElement('div');
                    feedRow.className = `feed-row ${layout.rowClass}`;
                    
                    layout.items.forEach(itemClass => {
                        if (imageIndex >= images.length) return;
                        
                        const feedItem = this.createFeedItem(images[imageIndex], itemClass);
                        feedRow.appendChild(feedItem);
                        imageIndex++;
                    });
                    
                    if (feedRow.children.length > 0) {
                        feed.appendChild(feedRow);
                    }
                    layoutIndex++;
                }
            }

            createFeedItem(image, sizeClass) {
                const feedItem = document.createElement('div');
                feedItem.className = `feed-item ${sizeClass}`;
                
                const img = document.createElement('img');
                img.src = image.path + image.filename;
                img.alt = image.title;
                img.loading = 'lazy';
                
                const overlay = document.createElement('div');
                overlay.className = 'feed-overlay';
                
                // Only show click indicator, no titles
                const clickIndicator = document.createElement('div');
                clickIndicator.className = 'click-indicator';
                clickIndicator.innerHTML = '⊕';
                
                overlay.appendChild(clickIndicator);
                
                feedItem.appendChild(img);
                feedItem.appendChild(overlay);
                
                feedItem.onclick = () => this.openLightbox(image.path + image.filename, image.title, image.description);
                
                return feedItem;
            }

            nextSlide() {
                const slides = document.querySelectorAll('.slider-image');
                slides[this.currentSlide].classList.remove('active');
                this.currentSlide = (this.currentSlide + 1) % slides.length;
                slides[this.currentSlide].classList.add('active');
            }

            prevSlide() {
                const slides = document.querySelectorAll('.slider-image');
                slides[this.currentSlide].classList.remove('active');
                this.currentSlide = this.currentSlide === 0 ? slides.length - 1 : this.currentSlide - 1;
                slides[this.currentSlide].classList.add('active');
            }

            // New method: Open current slider image when clicked
            openCurrentSliderImage() {
                const currentImage = this.sliderImages[this.currentSlide];
                this.openLightbox(currentImage.path + currentImage.filename, currentImage.title, currentImage.description);
            }

            openLightbox(src, title, description) {
                const lightbox = document.getElementById('lightbox');
                const lightboxImage = document.getElementById('lightbox-image');
                const lightboxTitle = document.getElementById('lightbox-title');
                const lightboxDescription = document.getElementById('lightbox-description');
                
                lightboxImage.src = src;
                lightboxTitle.textContent = title;
                lightboxDescription.textContent = description;
                lightbox.classList.add('active');
            }
        }

        // Custom cursor
        class CustomCursor {
            constructor() {
                this.cursor = document.getElementById('custom-cursor');
                this.interactiveElements = document.querySelectorAll('a, button, .feed-item, .slider-image');
                this.init();
            }

            init() {
                this.cursor.style.opacity = '0';

                window.addEventListener('mousemove', e => {
                    this.cursor.style.left = e.clientX + 'px';
                    this.cursor.style.top = e.clientY + 'px';
                });

                document.addEventListener('mouseenter', () => {
                    this.cursor.style.opacity = '1';
                });

                document.addEventListener('mouseleave', () => {
                    this.cursor.style.opacity = '0';
                });

                this.updateInteractiveElements();
            }

            updateInteractiveElements() {
                // Re-select elements after dynamic loading
                this.interactiveElements = document.querySelectorAll('a, button, .feed-item, .slider-image');
                
                this.interactiveElements.forEach(element => {
                    element.addEventListener('mouseenter', () => {
                        this.cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                        this.cursor.style.borderBottomColor = 'var(--accent-yellow)';
                    });

                    element.addEventListener('mouseleave', () => {
                        this.cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                        this.cursor.style.borderBottomColor = 'var(--text-primary)';
                    });
                });
            }
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Prevent automatic scroll restoration
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            window.scrollTo(0, 0);

            const gallery = new UnifiedPhotographyGallery();
            const cursor = new CustomCursor();
            
            // Update cursor interactive elements after gallery loads
            setTimeout(() => {
                cursor.updateInteractiveElements();
            }, 500);
        });

        // Close lightbox when clicking outside content
        document.addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
