<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco Santelices Ariztía | Agencia de Contenido Audiovisual Chile</title>
    <meta name="description" content="Francisco Santelices Ariztía - Agencia de contenido audiovisual especializada en producción de videos, motion graphics y diseño gráfico en Chile.">
    <meta name="keywords" content="Francisco Santelices, agencia contenido audiovisual, producción videos Chile, motion graphics, diseño gráfico, agencia creativa Santiago">
    <meta name="author" content="Francisco Santelices Ariztía">
    <link rel="stylesheet" href="assets/css/loading.css">
</head>
<body>
    <div id="custom-cursor"></div>
    <!-- Contenido de la página de loading -->
    <div class="loading-content">
        <!-- Video de fondo en la parte superior -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="assets/videos/tentaculos.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>
        
        <!-- Sección negra con texto -->
        <div class="text-section">
            <div class="loading-text">
                <h1 class="main-title">FRANCISCO SANTELICES ARIZTÍA</h1>
                <h2 class="sub-title">CREATIVE CONTENT</h2>
            </div>
            
            <div class="enter-button-container">
                <button class="enter-button" onclick="window.location.href='main.html'">
                    INGRESAR AL SITIO
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript para cursor personalizado -->
    <script>
        class CustomCursor {
            constructor() {
                this.cursor = document.getElementById('custom-cursor');
                this.interactiveElements = document.querySelectorAll('button, a, .grid-item, #menu-trigger, input');
                this.init();
            }

            init() {
                this.cursor.style.opacity = '0';

                window.addEventListener('mousemove', e => {
                    this.cursor.style.left = e.clientX + 'px';
                    this.cursor.style.top = e.clientY + 'px';
                });

                document.addEventListener('mouseenter', () => {
                    this.cursor.style.opacity = '1';
                });

                document.addEventListener('mouseleave', () => {
                    this.cursor.style.opacity = '0';
                });

                this.interactiveElements.forEach(element => {
                    element.addEventListener('mouseenter', () => {
                        this.cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                        this.cursor.style.mixBlendMode = 'difference';
                    });

                    element.addEventListener('mouseleave', () => {
                        this.cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                        this.cursor.style.mixBlendMode = 'normal';
                    });
                });
            }
        }

        // Initialize cursor when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new CustomCursor();
        });
    </script>
</body>
</html>
