<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Francisco Santelices Ariztía - Agencia de Contenidos Creative Content">
    <meta http-equiv="Cache-Control" content="max-age=3600">
    <title>Francisco Santelices Ariztía - Creative Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="VIDEO ASSETS/tentaculos.mp4" as="video" type="video/mp4">
    <style>
        /* Critical CSS inlined for faster loading */
        :root { --black: #050505; --text-primary: #FFFFFF; --accent-yellow: #f0b90c; --font-primary: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        body, html { height: 100%; overflow: hidden; font-family: var(--font-primary); background-color: var(--black); color: var(--text-primary); margin: 0; padding: 0; }
        .loading-content { height: 100vh; display: flex; flex-direction: column; color: var(--text-primary); background-color: var(--black); }
        .video-background { width: 100%; height: 60vh; position: relative; overflow: hidden; background-color: #050505 !important; }
        .video-background video { width: 100%; height: 100%; object-fit: cover; object-position: center center; transform: scale(0.86); background-color: var(--black); }
        .text-section { flex: 1; background-color: var(--black); display: flex; flex-direction: column; justify-content: center; margin: 0; padding: 0; }
        .loading-text { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; max-width: 600px; margin: 0 auto; width: 100%; }
        .text-lines-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 95vw; }
        .agency-title { font-size: clamp(0.5rem, 1.2vw, 0.9rem); font-weight: 300; letter-spacing: clamp(0.15rem, 0.35vw, 0.25rem); text-transform: uppercase; margin-bottom: 0.5rem; color: var(--text-primary); line-height: 1.1; white-space: nowrap; width: 100%; text-align: center; }
        .main-title { font-size: clamp(0.77rem, 1.76vw, 1.375rem); font-weight: 700; letter-spacing: clamp(0.22rem, 0.545vw, 0.425rem); text-transform: uppercase; margin-bottom: 0.165rem; color: var(--text-primary); line-height: 1.1; white-space: nowrap; width: 100%; text-align: center; }
        .sub-title { font-size: clamp(0.79rem, 1.8vw, 1.395rem); font-weight: 400; letter-spacing: clamp(0.72rem, 1.66vw, 1.19rem); text-transform: uppercase; color: var(--accent-yellow); white-space: nowrap; width: 100%; text-align: center; margin-left: clamp(4px, 0.5vw, 9px); }
    </style>
    <link rel="stylesheet" href="loading.css" media="print" onload="this.media='all'">
</head>
<body>
    <div id="custom-cursor"></div>
    <div class="loading-content">
        <!-- Video arriba -->
        <div class="video-background">
            <video autoplay loop muted playsinline preload="metadata">
                <source src="tentaculos.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>

        <!-- Área negra con texto abajo -->
        <div class="text-section">
            <div class="loading-text">
                <div class="text-lines-container">
                    <h3 class="agency-title">AGENCIA DE CONTENIDOS</h3>
                    <h1 class="main-title">FRANCISCO SANTELICES ARIZTÍA</h1>
                    <h2 class="sub-title">CREATIVE CONTENT</h2>
                </div>
            </div>
            
            <!-- Botón abajo -->
            <div class="enter-button-container">
                <button class="enter-button" onclick="window.location.href='main.html'">
                    <span id="typewriter-button"></span><span id="cursor-button"></span>
                </button>
            </div>
            
            <!-- Loading indicator for videos -->
            <div class="video-loading-indicator" id="video-loading">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <small>loading...</small>
            </div>
        </div>
    </div>

    <script>
        // Efecto de escritura para el botón
        function typeWriter() {
            const text = "INGRESAR AL SITIO";
            const typewriterElement = document.getElementById('typewriter-button');
            const cursorElement = document.getElementById('cursor-button');
            let i = 0;

            // Mostrar el cursor inmediatamente
            cursorElement.style.opacity = '1';

            function type() {
                if (i < text.length) {
                    typewriterElement.textContent += text.charAt(i);
                    typewriterElement.style.opacity = '1';
                    i++;
                    setTimeout(type, 100); // Velocidad de escritura
                } else {
                    // Al terminar de escribir, mantener el cursor parpadeando
                    cursorElement.style.opacity = '1';
                }
            }

            // Iniciar escritura después de 3.5 segundos
            setTimeout(() => {
                type();
            }, 3500);
        }

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', typeWriter);

        // Video loading management
        function handleVideoLoading() {
            const video = document.querySelector('video');
            const loadingIndicator = document.getElementById('video-loading');
            
            if (video && loadingIndicator) {
                // Show loading initially
                loadingIndicator.classList.remove('hidden');
                
                // Hide loading when video can play through
                video.addEventListener('canplaythrough', () => {
                    setTimeout(() => {
                        loadingIndicator.classList.add('hidden');
                    }, 1000); // Small delay to make it feel more natural
                });
                
                // Also hide on load complete
                video.addEventListener('loadeddata', () => {
                    setTimeout(() => {
                        loadingIndicator.classList.add('hidden');
                    }, 1500);
                });
                
                // Fallback: hide after 8 seconds regardless
                setTimeout(() => {
                    loadingIndicator.classList.add('hidden');
                }, 8000);
            }
        }

        // Initialize video loading
        document.addEventListener('DOMContentLoaded', handleVideoLoading);

        // Custom cursor functionality
        const cursor = document.getElementById('custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Hover effects
        const hoverElements = document.querySelectorAll('.enter-button');
        
        hoverElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                document.body.classList.add('cursor-hover');
            });
            
            element.addEventListener('mouseleave', () => {
                document.body.classList.remove('cursor-hover');
            });
        });
    </script>
</body>
</html>
