<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco Santelices Ariztía - Creative Content</title>
    <link rel="stylesheet" href="loading.css">
</head>
<body>
    <div id="custom-cursor"></div>
    <div class="loading-content">
        <!-- Video arriba -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="VIDEO ASSETS/tentaculos.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>

        <!-- Área negra con texto abajo -->
        <div class="text-section">
            <div class="loading-text">
                <div class="text-lines-container">
                    <h3 class="agency-title">AGENCIA DE CONTENIDOS</h3>
                    <h1 class="main-title">FRANCISCO SANTELICES ARIZTÍA</h1>
                    <h2 class="sub-title">CREATIVE CONTENT</h2>
                </div>
            </div>
            
            <!-- Botón abajo -->
            <div class="enter-button-container">
                <button class="enter-button" onclick="window.location.href='main.html'">
                    <span id="typewriter-button"></span><span id="cursor-button"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Efecto de escritura para el botón
        function typeWriter() {
            const text = "INGRESAR AL SITIO";
            const typewriterElement = document.getElementById('typewriter-button');
            const cursorElement = document.getElementById('cursor-button');
            let i = 0;

            // Mostrar el cursor inmediatamente
            cursorElement.style.opacity = '1';

            function type() {
                if (i < text.length) {
                    typewriterElement.textContent += text.charAt(i);
                    typewriterElement.style.opacity = '1';
                    i++;
                    setTimeout(type, 100); // Velocidad de escritura
                } else {
                    // Al terminar de escribir, mantener el cursor parpadeando
                    cursorElement.style.opacity = '1';
                }
            }

            // Iniciar escritura después de 3.5 segundos
            setTimeout(() => {
                type();
            }, 3500);
        }

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', typeWriter);

        // Custom cursor functionality
        const cursor = document.getElementById('custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Hover effects
        const hoverElements = document.querySelectorAll('.enter-button');
        
        hoverElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                document.body.classList.add('cursor-hover');
            });
            
            element.addEventListener('mouseleave', () => {
                document.body.classList.remove('cursor-hover');
            });
        });
    </script>
</body>
</html>
