<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Francisco Santelices Ariztía - Director audiovisual, diseñador gráfico y creador de contenido multimedia profesional en Chile. Portfolio de motion graphics, documentales y fotografía.">
    <meta name="keywords" content="Francisco Santelices, director audiovisual Chile, motion graphics, diseño gráfico, documentales, creador contenido multimedia">
    <meta name="author" content="Francisco Santelices Ariztía">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.franciscosantelices.cl/">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.franciscosantelices.cl/">
    <meta property="og:title" content="Francisco Santelices Ariztía - Director Audiovisual Chile">
    <meta property="og:description" content="Portfolio profesional de Francisco Santelices - Director audiovisual especializado en motion graphics, documentales y contenido multimedia en Chile.">
    <meta property="og:image" content="https://www.franciscosantelices.cl/assets/og-image.jpg">
    <meta property="og:locale" content="es_CL">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Francisco Santelices Ariztía - Director Audiovisual">
    <meta property="twitter:description" content="Director audiovisual y creador multimedia profesional en Chile.">
    <meta property="twitter:image" content="https://www.franciscosantelices.cl/assets/og-image.jpg">
    
    
    <title>Francisco Santelices Ariztía - Director Audiovisual y Creador Multimedia | Chile</title>
    <link rel="stylesheet" href="loading.css">
    <link rel="preload" href="https://www.franciscosantelices.cl/tentaculos.mp4" as="video" type="video/mp4">
    <meta name="theme-color" content="#050505">
    
    <!-- Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('SW registered: ', registration);
                })
                .catch((registrationError) => {
                    console.log('SW registration failed: ', registrationError);
                });
        });
    }
    </script>
</head>
<body>
    <div id="custom-cursor"></div>
    <div class="loading-content">
        <!-- Video de fondo -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="https://github.com/fjsantel/RESPALDO-SITIO/raw/main/tentaculos.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>

        <!-- Área negra con texto abajo -->
        <div class="text-section">
            <div class="loading-text">
                <div class="text-lines-container">
                    <h3 class="agency-title">AGENCIA DE CONTENIDOS</h3>
                    <h1 class="main-title">FRANCISCO SANTELICES ARIZTÍA</h1>
                    <h2 class="sub-title">CREATIVE CONTENT</h2>
                </div>
            </div>
            
            <div class="enter-button-container">
                <button class="enter-button" onclick="window.location.href='portfolio.html'">
                    INGRESAR AL SITIO
                </button>
            </div>
        </div>
    </div>

    <script>
        // Custom cursor functionality
        const cursor = document.getElementById('custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.transform = 'translate(-50%, -50%)';
        });

        // Hover effects for interactive elements
        const hoverElements = document.querySelectorAll('.enter-button, button, a');
        
        hoverElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                document.body.classList.add('cursor-hover');
            });
            
            element.addEventListener('mouseleave', () => {
                document.body.classList.remove('cursor-hover');
            });
        });

        // Initialize cursor position
        document.addEventListener('DOMContentLoaded', () => {
            cursor.style.opacity = '1';
        });
    </script>
</body>
</html>
