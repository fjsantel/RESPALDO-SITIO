<!-- EJEMPLO DE INTEGRACIÓN EN TU SITIO ACTUAL -->

<!-- 1. Incluir el CSS del sistema crop -->
<link rel="stylesheet" href="crop-system.css">

<!-- 2. Aplicar a tus videos existentes -->

<!-- EJEMPLO: Video de La Ruta de San Pedro con crop -->
<section class="ruta-sanpedro-video-section">
    <div class="ruta-sanpedro-video-container crop-container">
        <iframe class="ruta-sanpedro-video" 
                src="https://www.youtube.com/embed/DZLDqYBr2hE?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=DZLDqYBr2hE&controls=0&modestbranding=1&rel=0&showinfo=0&fs=0&iv_load_policy=3&disablekb=1" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;">
        </iframe>
        
        <!-- Barras de crop personalizadas -->
        <div class="crop crop-top crop-dark move-down-5"></div>
        <div class="crop crop-bottom crop-dark move-up-8"></div>
    </div>
    
    <!-- Resto del contenido... -->
</section>

<!-- EJEMPLO: Video INDH con crop diferente -->
<section class="indh-video-section">
    <div class="indh-video-container crop-container">
        <iframe class="indh-video" 
                src="https://www.youtube.com/embed/kqRkiYIKBCU?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=kqRkiYIKBCU&controls=0&modestbranding=1&rel=0&showinfo=0&fs=0&iv_load_policy=3&disablekb=1" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;">
        </iframe>
        
        <!-- Crop más sutil para este video -->
        <div class="crop crop-top crop-thin"></div>
        <div class="crop crop-bottom crop-thin move-up-3"></div>
    </div>
</section>

<!-- EJEMPLO: Para el slider principal de YouTube -->
<section class="video-block" style="width: 100vw; margin: 0; padding: 0; background: #000;">
    <div class="video-container youtube-container active crop-container" style="width: 100vw; height: 56.25vw; max-height: 100vh; position: relative; background: #000;">
        <iframe id="youtube-player" class="youtube-video active" 
                src="https://www.youtube.com/embed/L-ejHvF0UJU?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=L-ejHvF0UJU&controls=0&modestbranding=1&rel=0&showinfo=0&fs=0&iv_load_policy=3&disablekb=1&start=5" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000;">
        </iframe>
        
        <!-- Crop dinámico que se puede ajustar por JavaScript -->
        <div id="main-video-crop-top" class="crop crop-top crop-dark move-down-10"></div>
        <div id="main-video-crop-bottom" class="crop crop-bottom crop-dark move-up-12"></div>
    </div>
</section>
