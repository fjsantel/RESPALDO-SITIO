name: Sync to RESPALDO-SITIO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
    
    - name: Add backup repository as remote
      run: |
        git remote add respaldo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/RESPALDO-SITIO.git || true
    
    - name: Force push to backup repository
      run: |
        git push respaldo main --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify sync completed
      run: |
        echo "✅ Sincronización completada exitosamente"
        echo "Repositorio principal: https://github.com/${{ github.repository }}"
        echo "Repositorio respaldo: https://github.com/${{ github.repository_owner }}/RESPALDO-SITIO"