name: Sync to RESPALDO-SITIO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    
    - name: Setup Git
      run: |
        git config --global user.name 'Francisco Santelices'
        git config --global user.email 'noreply@franciscosantelices.cl'
    
    - name: Add backup repository as remote
      run: |
        git remote add respaldo https://x-access-token:${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/fjsantel/RESPALDO-SITIO.git || true
    
    - name: Force push to backup repository
      run: |
        git push respaldo main --force
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    
    - name: Verify sync completed
      run: |
        echo "✅ Sincronización completada exitosamente"
        echo "📂 Repositorio principal: https://fjsantel.github.io/francisco-santelices-agencia-contenido/"
        echo "🔄 Repositorio respaldo: https://fjsantel.github.io/RESPALDO-SITIO/"
        echo "🚀 Ambos sitios actualizados automáticamente"